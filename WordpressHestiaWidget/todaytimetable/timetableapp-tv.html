    --gold: #e9c46a;
    --line: rgba(255,255,255,.16);

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: none; }

    background: var(--bg);
    color: var(--ink);

  .clock { font-size: 7.6vh; font-weight: 800; letter-spacing: -0.04em; line-height: .95; }
  .dateline { font-size: 2.4vh; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -.6vh; }
  .dateline #hijri { color: var(--muted); }
  .dateline span + span:not(:empty)::before { content: "\00a0\00a0\2022\00a0\00a0"; color: var(--muted); }

  .next {
    background: var(--panel);
    border-radius: 2.4vh;
    padding: 1.5vh 1.6vw 1.5vh 1.4vw;
    border-left: 1.1vh solid var(--gold);
  }
  .next { display: flex; flex-direction: column; gap: 1vh; }
  .next-main { width: 100%; min-width: 0; }
  .next-line { display: flex; align-items: center; justify-content: space-between; gap: 1.2vw; }
  .next-info { flex: 1; min-width: 0; text-align: right; }
  .next-prog { min-width: 0; padding-top: .2vh; display: flex; flex-direction: column; gap: .3vh; }
  .next-prog[hidden] { display: none; }
  .np-label { font-size: 2.2vh; color: var(--muted); font-weight: 500; }
  .np-name { font-size: 2.6vh; font-weight: 700; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .np-when { font-size: 2.3vh; color: var(--gold); font-weight: 600; margin-top: .2vh; }
  .next-label { font-size: 2.6vh; font-weight: 500; color: var(--muted); }
  .next-time { font-size: 8.6vh; font-weight: 800; letter-spacing: -0.04em; line-height: 1; flex: none; color: var(--gold); }
  .next-count { font-size: 3vh; margin-top: .3vh; font-variant-numeric: tabular-nums; }
  .next-count strong { font-weight: 700; }
  .next.live .next-count strong::before {
    content: ""; display: inline-block; width: 2.2vh; height: 2.2vh; border-radius: 50%;
    background: var(--gold); margin-right: 1.4vh; animation: pulse 1.4s ease-in-out infinite;
  }

  /* Right: table */
  .right { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .thead { display: flex; justify-content: space-between; align-items: baseline; padding: 0 1.6vw 1vh; font-size: 2.1vh; color: var(--muted); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
  .thead .key { color: var(--gold); }
  .list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .6vh; container-type: size; }
  .row {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-between; gap: 1.5vw;
    padding: 0 1.6vw; border-radius: 1.6vh;
    font-size: 3.4vh; font-size: min(3.4vh, 8.5cqh); line-height: 1;
  }
  .row .name { font-weight: 600; }
  .row.minor { color: var(--muted); }
  .row.minor .name { font-weight: 400; }
  .row.past { color: var(--faint); }
  .row.past .name { font-weight: 400; }
  .row.tmrw { color: rgba(255,255,255,.8); }
  .row.tmrw .time { color: var(--gold); }
  .row.next-row { background: rgba(255,255,255,.14); }
  .row.now { background: #ffffff; color: var(--bg); }

  /* News panel (left side) */
  .news {
    width: 52vw; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-radius: 2.4vh; overflow: hidden; position: relative;
  }
  .news[hidden] { display: none; }
  .news-img { flex: 1; min-height: 0; background: rgba(0,0,0,.28) center / contain no-repeat; }
  .news-img[hidden] { display: none; }
  .news-text { flex: none; padding: 1.5vh 2vw 1.7vh; display: flex; align-items: baseline; gap: 1.4vw; transition: opacity .5s; }
  .news-img[hidden] + .news-text { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .news-text.fade { opacity: 0; }
  .news-meta { flex: none; font-size: 2.2vh; color: var(--gold); font-weight: 600; white-space: nowrap; }
  .news-meta:empty { display: none; }
  .news-title { flex: 1; min-width: 0; font-size: 3.2vh; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .news-dots { position: absolute; right: 1.2vw; top: 1.4vh; display: flex; gap: .8vh; padding: .8vh 1vh; border-radius: 2vh; background: rgba(0,0,0,.4); }
  .news-dots i { width: 1.2vh; height: 1.2vh; border-radius: 50%; background: rgba(255,255,255,.4); }
  .news-dots i.on { background: var(--gold); }

  /* Weekly programmes slide */
  .prog { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 2.6vh 2vw 2.4vh; transition: opacity .5s; }
  .prog.fade { opacity: 0; }
  .news > .prog[hidden], .news > .news-text[hidden] { display: none; }
  .prog-title { font-size: 4.6vh; font-weight: 800; line-height: 1.1; margin: .4vh 0 1.6vh; }
  .prog-list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1vh; }
  .prog-row { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 1.4vw; border-radius: 1.6vh; background: rgba(255,255,255,.06); }
  .prog-row.today { background: rgba(255,255,255,.2); box-shadow: inset .8vh 0 0 var(--gold); }
  .prog-name { font-size: 2.9vh; font-weight: 700; line-height: 1.15; }
  .prog-sub { font-size: 2.3vh; color: var(--muted); line-height: 1.2; }
  .prog-time { font-size: 2.6vh; color: var(--gold); font-weight: 600; margin-top: .3vh; }

  /* Notice (from the "message" tab, cell A1): bottom of the right-hand column, grows to fit, no scrolling */
  .col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 2.2vh; }
  .notice {
    flex: none; max-height: 24vh; overflow: hidden;
    background: var(--gold); color: var(--bg); border-radius: 2vh; padding: 1.1vh 1.4vw 1.4vh;
  }
  .notice[hidden] { display: none; }
  .notice-tag { font-size: 1.7vh; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
  .notice-track { font-size: 2.9vh; font-weight: 700; line-height: 1.22; margin-top: .3vh; overflow-wrap: anywhere; }

  /* States */
  .state {
    grid-column: 1 / -1; align-self: center; text-align: center;
    font-size: 5vh; line-height: 1.5; color: var(--muted);
  }
  .state small { display: block; font-size: 3vh; margin-top: 1vh; color: var(--faint); }
  .skeleton { height: 3vh; border-radius: 1.5vh; background: var(--line); margin: 3vh auto; width: 40%; animation: pulse 1.4s ease-in-out infinite; }
  .stale { position: fixed; right: 1.5vw; bottom: 1vh; font-size: 2.2vh; color: var(--gold); }
  @keyframes pulse { 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .skeleton, .next.live .next-count strong::before { animation: none; } }

  /* Portrait / narrow screens: stack */
  @media (max-aspect-ratio: 1/1) {
    html, body { overflow: auto; }
    .page { height: auto; min-height: 100vh; flex-direction: column; }
    .news { width: 100%; height: 55vh; }
    .col, .screen { flex: none; }
    .right { min-height: 60vh; }
    .clock { font-size: 9vh; }
    .row { font-size: 4.2vh; }
    .next-time { font-size: 10vh; }
    .next { flex-direction: column; }
    .next-prog { border-left: 0; padding-left: 0; }
  }
</style>
</head>

      <div class="news-title" id="newsTitle"></div>

    <div class="prog" id="prog" hidden></div>
    <div class="news-dots" id="newsDots"></div>

  function loadTomorrow() {

  function load() {
    loadTomorrow();
    jsonp("https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?gid=" + GID +
      "&tqx=out:json;responseHandler:__CB__&tq=" + encodeURIComponent(QUERY),

  function cellMinutes(c) {

  function cellText(c) {

  function parse(table) {

  }

  function render() {

    var html = '<section class="left"><div class="top"><div class="clock" id="clock"></div>' +
      '<div class="logo" role="img" aria-label="Leytonstone Masjid, Leytonstone Islamic Association"></div></div>' +
      '<div class="dateline"><span id="date"></span><span id="hijri"></span></div>' +
      '<div class="next" id="next"><div class="next-main"><div class="next-line"><div class="next-time" id="nextTime"></div><div class="next-info"><div class="next-label" id="nextName"></div><div class="next-count" id="nextCount"></div></div></div></div><div class="next-prog" id="nextProg" hidden></div></div>' +

  var HIJRI_MONTHS = ["Muharram", "Safar", "Rabi\u2019 al-Awwal", "Rabi\u2019 al-Thani", "Jumada al-Awwal", "Jumada al-Thani",

  }

  // ---- Next programmes (from the weekly programmes table) -----------------

  var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var PRAYER_RE = { fajr: /fajr|fajar/i, zuhr: /zuhr|zuhar|zohr|dhuhr|dhur/i, asr: /asr/i, maghrib: /maghrib/i, isha: /isha|esha/i };

    if (m) {
      var re = null;
      for (var k in PRAYER_RE) { if (PRAYER_RE[k].test(m[1])) re = PRAYER_RE[k]; }
      for (var i = 0; i < rows.length; i++) { if (re && re.test(rows[i].name) && rows[i].jam !== null) return rows[i].jam + 10; }
      return null;
    }
    var c = time.match(/(\d{1,2})[.:](\d{2})\s*(am|pm)?/i), h, min, ap;

  function nextProgs(nowMins, dow) {

      while ((m = re.exec(r.time))) days.push(DAYS.indexOf(m[1].slice(0, 3).toLowerCase()));

  function renderNextProgs(nowMins, dow) {

  // Normalise prayer names so "Dhuhr"/"Zuhr" etc. match between today's and tomorrow's blocks.
  function canon(n) {

    if (/zuhr|zuhar|zohr|dhuhr|dhur/.test(n)) return "zuhr";

  }

  // Match each displayed prayer to tomorrow's row: by name first, then by closest start time.
  function tomorrowMap() {

      if (!key) return;
      for (var k = 0; k < tomorrowRows.length; k++) {
        if (!used[k] && canon(tomorrowRows[k].name) === key) { map[i] = tomorrowRows[k]; used[k] = 1; return; }
      }

  var lastRefresh = Date.now();
  function tick() {

    var parts = {};

      .formatToParts(now).forEach(function (p) { parts[p.type] = +p.value; });
    var nowMins = parts.hour * 60 + parts.minute + parts.second / 60;

    $("clock").textContent = pad(parts.hour) + ":" + pad(parts.minute);
    $("date").textContent = now.toLocaleDateString("en-GB", { timeZone: TZ, weekday: "long", day: "numeric", month: "long", year: "numeric" });
    try {
      var hp = {};
      new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn", { timeZone: TZ, day: "numeric", month: "numeric", year: "numeric" })
        .formatToParts(now).forEach(function (p) { hp[p.type] = parseInt(p.value, 10); });
      var hy = hp.relatedYear || hp.year;
      if (!(hp.month >= 1 && hp.month <= 12) || !(hy > 1300 && hy < 1600)) throw new Error("bad");
      $("hijri").textContent = hp.day + " " + HIJRI_MONTHS[hp.month - 1] + " " + hy + " AH";
    } catch (e) { $("hijri").textContent = ""; }

    var dayKey = now.toLocaleDateString("en-CA", { timeZone: TZ });
    if ((lastDay && lastDay !== dayKey) || Date.now() - lastRefresh > REFRESH_MINUTES * 60000) {
      lastDay = dayKey; lastRefresh = Date.now(); load(); if (lastDay !== dayKey) return;
    }
    lastDay = dayKey;

    var wd = now.toLocaleDateString("en-GB", { timeZone: TZ, weekday: "short" }).slice(0, 3).toLowerCase();
    renderNextProgs(nowMins, DAYS.indexOf(wd));

    var nowIdx = -1, nextIdx = -1;
    for (var i = 0; i < rows.length; i++) {
      var j = rows[i].jam;

    }
    var activeIdx = nowIdx !== -1 ? nowIdx : nextIdx;

    var tmap = tomorrowRows.length ? tomorrowMap() : [], anyTm = false;
    document.querySelectorAll(".row").forEach(function (el, i) {
      var r = rows[i], j = r.jam;
      var fin = j !== null && (activeIdx === -1 || i < activeIdx);   // this prayer has finished
      var tm = fin ? tmap[i] : null;                                  // so show tomorrow's times for it
      el.classList.toggle("now", i === nowIdx);
      el.classList.toggle("next-row", i === nextIdx);
      el.classList.toggle("past", fin && !tm);
      el.classList.toggle("tmrw", !!tm);

      var txt = tm ? tm.jamText : (r.jamCol >= 0 ? r.times[r.jamCol].text : "");

  // ---- News + weekly programmes ------------------------------------------
  var posts = [], progRows = [], slides = [], slideIdx = 0, slideTimer = null;

  function plain(html) {

  function getJson(url) { return fetch(url, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }

  // The weekly programmes post holds a two-column table: programme | day/time.
  function parseProg(html) {

      var name = td[0].innerHTML.split(/<br\s*\/?>/i).map(plain).filter(Boolean)
        .map(function (t) { return t.replace(/\s*:\s*$/, ""); });

  function loadNews() {

      posts = list.filter(function (p) { return p.slug !== "weekly-programmes"; })
        .slice(0, NEWS_COUNT).map(shape).filter(function (n) { return n.title; });

  function renderProg() {
    var today = new Date().toLocaleDateString("en-GB", { timeZone: TZ, weekday: "long" }).toLowerCase();
    $("prog").innerHTML = '<div class="news-meta">This week at the masjid</div><div class="prog-title">Weekly Programmes</div><div class="prog-list">' +
      progRows.map(function (r) {

  // ---- Notice message (tab "message", cell A1) ---------------------------
  function loadNotice() {
    jsonp("https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?sheet=" + encodeURIComponent(MESSAGE_SHEET) +

      function (resp) {
        if (resp.status !== "ok") return;                 // keep whatever is showing if the sheet can't be read
        var row = resp.table.rows && resp.table.rows[0], c = row && row.c && row.c[0];
        var text = c && c.v != null ? String(c.v).replace(/\s+/g, " ").trim() : "";
        if (/^null$/i.test(text)) text = "";
        showNotice(text);
      }, function () {});
  }

  function showNotice(text) {
    var bar = $("notice");
    if (!text) { bar.hidden = true; bar.dataset.t = ""; return; }
    if (bar.dataset.t === text) return;                   // unchanged
    bar.dataset.t = text; bar.hidden = false;
    $("noticeTrack").textContent = text;
    layoutNotice();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutNotice);
  }

  // The bar grows to fit the message. Very long text shrinks slightly so it always fits in full,
  // and the page content above is lifted to make room.
  function layoutNotice() {
    var bar = $("notice"), track = $("noticeTrack");
    if (bar.hidden) return;
    var size = 2.9;
    track.style.fontSize = size + "vh";
    while (size > 2 && bar.scrollHeight > bar.clientHeight + 1) { size -= 0.2; track.style.fontSize = size + "vh"; }
  }
  window.addEventListener("resize", layoutNotice);

  load();
  loadNews();
  loadNotice();
  setInterval(loadNotice, MESSAGE_REFRESH_SECONDS * 1000);
  setInterval(loadNews, NEWS_REFRESH_MINUTES * 60000);
})();
</script>
</body>
</html>
