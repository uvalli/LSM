<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS Prayer Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #12302b;
    --muted: #5f726d;
    --line: #e3e7e4;
    --accent: #086754;
    --hero-bg: #086754;
    --hero-ink: #ffffff;
    --accent-ink: #ffffff;
    --glow: #e6f1ed;
    --past: #9aa8a4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1f1c;
      --card: #12302b;
      --ink: #eef3f1;
      --muted: #9db3ad;
      --line: #21433d;
      --accent: #e9c46a;
      --accent-ink: #1a2b27;
      --glow: #1a3d36;
      --past: #5f7a73;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1f1c; --card: #12302b; --ink: #eef3f1; --muted: #9db3ad;
    --line: #21433d; --accent: #e9c46a; --accent-ink: #1a2b27; --glow: #1a3d36; --past: #5f7a73;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #086754; }
  body {
    background: #086754;
    color: var(--ink);
    font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    padding: 8px;
    display: flex;
    justify-content: center;
  }

  .widget {
    width: 100%;
    max-width: 340px;
    background: #086754;
    color: #ffffff;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 16px;
    overflow: hidden;
  }

  /* Hero: next prayer */
  .hero {
    background: var(--hero-bg);
    color: var(--hero-ink);
    padding: 12px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,.18);
  }
  .hero-top {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-size: 13px; opacity: .85;
  }
  .hero-hijri { font-size: 12px; opacity: .8; margin-top: 1px; }
  .hero-name { font-size: 13px; font-weight: 500; margin: 10px 0 0; opacity: .9; }
  .hero-top, .hero-hijri { opacity: .7; }
  .hero-time {
    font-size: clamp(30px, 9vw, 38px);
    font-weight: 700; letter-spacing: -0.03em; line-height: 1;
  }
  .hero-count { margin-top: 4px; font-size: 13px; opacity: .9; }
  .hero-count strong { font-weight: 600; }

  /* Table */
  .list { list-style: none; margin: 0; padding: 4px 8px 8px; }
  .head, .row {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) repeat(var(--cols, 2), minmax(0, 1fr));
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
  }
  .head { font-size: 12px; color: rgba(255,255,255,.72); padding-bottom: 2px; }
  .head span:not(:first-child), .row span:not(:first-child) { text-align: right; }
  .row { border-radius: 10px; font-size: 15px; }
  .row + .row { margin-top: 1px; }
  .row .name { font-weight: 600; }
  .row.past { color: rgba(255,255,255,.5); }
  .row.past .name { font-weight: 500; }
  .row.tmrw span:not(.name) { color: #f4d58d; }   /* tomorrow's times */
  .hero.tmrw .hero-name, .hero.tmrw .hero-time { color: #f4d58d; }
  .row.next {
    background: rgba(255,255,255,.16);
    box-shadow: inset 3px 0 0 #ffffff;
  }

  .row.now {
    background: #ffffff; color: #086754;
  }
  .hero.live .hero-count strong::before {
    content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: currentColor; margin-right: 8px; animation: pulse 1.4s ease-in-out infinite;
  }

  /* States */
  .state { padding: 24px 16px; text-align: center; color: rgba(255,255,255,.85); font-size: 15px; line-height: 1.5; }
  .state button {
    margin-top: 14px; font: inherit; font-weight: 600; cursor: pointer;
    background: #ffffff; color: #086754;
    border: 0; border-radius: 999px; padding: 10px 20px;
  }
  .skeleton { height: 14px; border-radius: 7px; background: rgba(255,255,255,.22); margin: 14px auto; width: 70%; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  button:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
<main class="widget" aria-live="polite">
  <section class="hero" id="hero" hidden>
    <div class="hero-top"><span id="dateText"></span><span id="clockText"></span></div>
    <div class="hero-hijri" id="hijriText"></div>
    <div class="hero-name" id="heroName"></div>
    <div class="hero-time" id="heroTime"></div>
    <div class="hero-count" id="heroCount"></div>
  </section>
  <div id="body">
    <div class="state"><div class="skeleton"></div><div class="skeleton" style="width:55%"></div><div class="skeleton"></div></div>
  </div>
</main>

<script>
(function () {
  // ---- Settings -----------------------------------------------------------
  var SHEET_ID = "1Zx8nlmg0CwF1o2EzMJknJuxUU8Wk57LAfJ-rZnDsX4k";
  var GID      = 0;
  var RANGE    = "AP1:AR16";   // prayer name | start | jamaat — today's and tomorrow's prayers
  var GRACE    = 5;            // minutes after jamaat during which the prayer shows as "taking place"
  var TZ       = "Europe/London";
  // -------------------------------------------------------------------------

  var today = [];       // today's prayers: {name, times:[{text,mins}], jam, jamText}
  var tmr = [];         // tomorrow's matching prayer for each entry in today (or null)
  var labels = [];
  var timer = null;
  var lastDay = null;
  var shown = [];       // what each row currently displays: "t" (today) or "m" (tomorrow)

  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function load() {
    $("hero").hidden = true;
    $("body").innerHTML = '<div class="state"><div class="skeleton"></div><div class="skeleton" style="width:55%"></div><div class="skeleton"></div></div>';

    var cb = "lsCb" + Date.now();
    var script = document.createElement("script");
    var done = false;
    var timeout = setTimeout(function () { fail("The request timed out."); }, 12000);

    function cleanup() { clearTimeout(timeout); delete window[cb]; script.remove(); }
    function fail(msg) { if (done) return; done = true; cleanup(); showError(msg); }

    window[cb] = function (resp) {
      if (done) return; done = true; cleanup();
      if (resp.status !== "ok") {
        var m = (resp.errors && resp.errors[0] && (resp.errors[0].detailed_message || resp.errors[0].message)) || "Unknown error";
        return showError(m);
      }
      try { parse(resp.table); render(); } catch (e) { showError("The sheet format was not what the widget expected."); }
    };
    script.onerror = function () { fail("Could not reach Google Sheets."); };
    script.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?gid=" + GID +
      "&headers=0&range=" + RANGE + "&tqx=out:json;responseHandler:" + cb;
    document.head.appendChild(script);
  }

  function showError(msg) {
    $("hero").hidden = true;
    $("body").innerHTML = '<div class="state">Prayer times could not be loaded.<br>' + escapeHtml(msg) +
      '<br><button id="retry">Try again</button></div>';
    $("retry").onclick = load;
  }

  // Convert a sheet cell to minutes after midnight, or null if it is not a time.
  function cellMinutes(c) {
    if (!c) return null;
    if (Array.isArray(c.v) && c.v.length >= 2) return c.v[0] * 60 + c.v[1];           // timeofday
    var s = (c.f != null ? c.f : c.v);
    if (s == null) return null;
    var m = String(s).match(/(\d{1,2})[:.](\d{2})\s*(am|pm)?/i);
    if (!m) return null;
    var h = +m[1], min = +m[2], ap = m[3] && m[3].toLowerCase();
    if (ap === "pm" && h < 12) h += 12;
    if (ap === "am" && h === 12) h = 0;
    return h * 60 + min;
  }

  function cellText(c) {
    if (!c) return "";
    var mins = cellMinutes(c);
    if (mins !== null) return pad(Math.floor(mins / 60)) + ":" + pad(mins % 60);   // 24-hour HH:MM
    return c.f != null ? c.f : (c.v == null ? "" : String(c.v));
  }

  // Sheets sometimes store 12-hour times without AM/PM (e.g. "5:45" for Maghrib). Prayers run in order
  // through the day, so a time earlier than the one above it in the same column must be PM.
  function fixPM(list) {
    var maxCols = Math.max.apply(null, list.map(function (r) { return r.times.length; }).concat([0]));
    for (var c = 0; c < maxCols; c++) {
      var prev = -1;
      list.forEach(function (r) {
        var t = r.times[c];
        if (!t || t.mins === null) return;
        if (t.mins < prev && t.mins < 720) {
          t.mins += 720;
          t.text = pad(Math.floor(t.mins / 60)) + ":" + pad(t.mins % 60);
        }
        prev = Math.max(prev, t.mins);
      });
    }
  }

  function setJamaat(list, jamIdx) {
    list.forEach(function (r) {
      var t = jamIdx >= 0 ? r.times[jamIdx] : null;
      if (!t || t.mins === null) {
        t = null;
        for (var i = r.times.length - 1; i >= 0; i--) { if (r.times[i].mins !== null) { t = r.times[i]; break; } }
      }
      r.jam = t ? t.mins : null;
      r.jamText = t ? t.text : "";
    });
  }

  function parse(table) {
    var all = table.rows.map(function (r) {
      var cells = (r.c || []).map(function (c) { return { text: cellText(c), mins: cellMinutes(c) }; });
      var name = cells[0] && cells[0].mins === null ? cells[0].text.trim() : "";
      var times = cells.slice(name || (cells[0] && cells[0].mins === null) ? 1 : 0);
      return { name: name, times: times };
    });

    // Optional heading row (text but no times in the time columns) provides the column labels.
    labels = [];
    for (var h = 0; h < all.length; h++) {
      var r = all[h];
      var hasTime = r.times.some(function (t) { return t.mins !== null; });
      var hasText = r.times.some(function (t) { return t.text; });
      if (!hasTime && hasText) { labels = [""].concat(r.times.map(function (t) { return t.text; })); break; }
    }

    var prayers = all.filter(function (r) { return r.times.some(function (t) { return t.mins !== null; }); });
    if (!prayers.length) throw new Error("empty");

    // First time a prayer name appears = today; the second time = tomorrow.
    var seen = {}, tomorrowByName = {};
    today = []; tmr = [];
    prayers.forEach(function (r) {
      var key = r.name.toLowerCase();
      if (key && !seen[key]) { seen[key] = true; today.push(r); }
      else if (key && seen[key] && !tomorrowByName[key]) { tomorrowByName[key] = r; }
      else if (!key) { today.push(r); }
    });
    var tomorrowList = today.map(function (r) { return tomorrowByName[r.name.toLowerCase()] || null; });

    // No names in the sheet: assume the first half is today and the second half is tomorrow.
    if (today.every(function (r) { return !r.name; }) && prayers.length % 2 === 0) {
      var half = prayers.length / 2;
      today = prayers.slice(0, half);
      tomorrowList = prayers.slice(half);
    }

    fixPM(today);
    fixPM(tomorrowList.filter(Boolean));

    var jamLabel = -1;
    labels.forEach(function (l, i) { if (/jam/i.test(l)) jamLabel = i; });
    var jamIdx = jamLabel > 0 ? jamLabel - 1 : -1;
    setJamaat(today, jamIdx);
    setJamaat(tomorrowList.filter(Boolean), jamIdx);
    tmr = tomorrowList;
  }

  function render() {
    var colCount = Math.max.apply(null, today.map(function (r) { return r.times.length; }));

    var html = '<ul class="list" style="--cols:' + colCount + '">';
    today.forEach(function (r, i) {
      html += '<li class="row" data-i="' + i + '"><span class="name">' + escapeHtml(r.name || "") + "</span>";
      for (var c = 0; c < colCount; c++) html += "<span></span>";
      html += "</li>";
    });
    html += "</ul>";
    $("body").innerHTML = html;
    $("hero").hidden = false;
    shown = [];

    tick();
    clearInterval(timer);
    timer = setInterval(tick, 1000);
  }

  function countdown(secs) {
    secs = Math.max(0, Math.round(secs));
    var h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
    return "In <strong>" + (h ? h + "h " + pad(m) + "m" : m + "m " + pad(s) + "s") + "</strong>";
  }

  function tick() {
    var now = new Date();   // all logic uses UK time, whatever the visitor's device is set to
    var parts = {};
    new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hourCycle: "h23", hour: "numeric", minute: "numeric", second: "numeric" })
      .formatToParts(now).forEach(function (p) { parts[p.type] = +p.value; });
    var nowMins = parts.hour * 60 + parts.minute + parts.second / 60;

    $("dateText").textContent = now.toLocaleDateString("en-GB", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
    try {
      // Numeric month + our own names: some browsers print the wrong month name for this calendar.
      var hp = {};
      new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn", { timeZone: TZ, day: "numeric", month: "numeric", year: "numeric" })
        .formatToParts(now).forEach(function (p) { hp[p.type] = parseInt(p.value, 10); });
      var HIJRI_MONTHS = ["Muharram", "Safar", "Rabi\u2019 al-Awwal", "Rabi\u2019 al-Thani", "Jumada al-Awwal", "Jumada al-Thani",
        "Rajab", "Sha\u2019ban", "Ramadan", "Shawwal", "Dhu al-Qi\u2019dah", "Dhu al-Hijjah"];
      var hy = hp.relatedYear || hp.year;
      if (!(hp.month >= 1 && hp.month <= 12) || !(hy > 1300 && hy < 1600)) throw new Error("bad hijri date");
      $("hijriText").textContent = hp.day + " " + HIJRI_MONTHS[hp.month - 1] + " " + hy + " (Umm al-Qura)";
      $("hijriText").hidden = false;
    } catch (e) { $("hijriText").hidden = true; }
    $("clockText").textContent = now.toLocaleTimeString("en-GB", { timeZone: TZ, hourCycle: "h23", hour: "2-digit", minute: "2-digit" });

    var dayKey = now.toLocaleDateString("en-CA", { timeZone: TZ });
    if (lastDay && lastDay !== dayKey) { lastDay = dayKey; load(); return; }   // new UK day: reload the sheet
    lastDay = dayKey;

    // Which prayer is taking place now, and which is next?
    var nowIdx = -1, nextIdx = -1;
    for (var i = 0; i < today.length; i++) {
      var j = today[i].jam;
      if (j === null) continue;
      if (nowMins >= j && nowMins < j + GRACE) { nowIdx = i; break; }
      if (nowMins < j) { nextIdx = i; break; }
    }
    // Everything has finished: the next prayer is tomorrow's first one.
    var nextTomorrow = -1;
    if (nowIdx === -1 && nextIdx === -1) {
      for (var k = 0; k < today.length; k++) { if (tmr[k] && tmr[k].jam !== null) { nextTomorrow = k; break; } }
    }

    // Once a prayer's jamaat (+ grace) has passed, its row shows tomorrow's times.
    var rowEls = document.querySelectorAll(".row");
    rowEls.forEach(function (el, i) {
      var r = today[i];
      var finished = r.jam !== null && nowMins >= r.jam + GRACE && !!tmr[i];
      var data = finished ? tmr[i] : r;
      var key = finished ? "m" : "t";
      if (shown[i] !== key) {
        shown[i] = key;
        var spans = el.querySelectorAll("span:not(.name)");
        spans.forEach(function (sp, c) { sp.textContent = data.times[c] ? data.times[c].text : ""; });
        el.classList.toggle("tmrw", finished);
      }
      el.classList.toggle("now", i === nowIdx);
      el.classList.toggle("next", i === nextIdx || i === nextTomorrow);
    });

    var nameEl = $("heroName"), timeEl = $("heroTime"), countEl = $("heroCount");
    $("hero").classList.toggle("live", nowIdx !== -1);
    $("hero").classList.toggle("tmrw", nowIdx === -1 && nextIdx === -1 && nextTomorrow !== -1);

    if (nowIdx !== -1) {
      var cur = today[nowIdx];
      nameEl.textContent = (cur.name || "Prayer") + " jamaat";
      timeEl.textContent = cur.jamText;
      countEl.innerHTML = "<strong>Currently taking place</strong>";
    } else if (nextIdx !== -1) {
      var nx = today[nextIdx];
      nameEl.textContent = (nx.name || "Next") + " jamaat";
      timeEl.textContent = nx.jamText;
      countEl.innerHTML = countdown((nx.jam - nowMins) * 60);
    } else if (nextTomorrow !== -1) {
      var tm = tmr[nextTomorrow];
      nameEl.textContent = (today[nextTomorrow].name || "First prayer") + " jamaat \u00b7 tomorrow";
      timeEl.textContent = tm.jamText;
      countEl.innerHTML = countdown((1440 - nowMins + tm.jam) * 60);
    } else {
      nameEl.textContent = "All jamaats are finished for today";
      timeEl.textContent = "";
      countEl.textContent = "";
    }
  }

  load();
})();
</script>
</body>
</html>
